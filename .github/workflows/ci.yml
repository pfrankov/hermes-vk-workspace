name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_REVISION: d923a5eb487a17c0a68801bba9ef0f56c81040a8
      HERMES_SOURCE_PATH: ${{ github.workspace }}/.ci/hermes-agent
      HERMES_HOME: ${{ github.workspace }}/.hermes-test
      HERMES_SKIP_DOTENV: "1"
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out supported stable Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REVISION }}
          path: .ci/hermes-agent
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .ci/hermes-agent/pyproject.toml

      - name: Install locked plugin dependencies
        run: uv sync --locked --group dev

      - name: Install the real Hermes host
        run: |
          test "$(git -C "$HERMES_SOURCE_PATH" rev-parse HEAD)" = "$HERMES_REVISION"
          uv pip install --python .venv/bin/python --editable "$HERMES_SOURCE_PATH"
          uv pip check --python .venv/bin/python

      # Do not sync again: an exact sync would remove the separately installed host.
      - name: Check Python code
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run unit and protocol tests
        run: uv run --no-sync pytest --ignore=tests/test_host_contract.py

      - name: Validate native plugin against stable Hermes
        run: uv run --no-sync pytest tests/test_host_contract.py

      - name: Verify dependency and plugin metadata stayed unchanged
        run: git diff --exit-code -- pyproject.toml uv.lock plugin.yaml
