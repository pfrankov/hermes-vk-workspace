name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_REVISION: bf0203a794a07aac3ff764972ab9087baa4e4f4e
      HERMES_SOURCE_PATH: ${{ github.workspace }}/.ci/hermes-agent
      HERMES_HOME: ${{ github.workspace }}/.hermes-test
      HERMES_SKIP_DOTENV: "1"
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out supported stable Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REVISION }}
          path: .ci/hermes-agent
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .ci/hermes-agent/uv.lock

      - name: Build the locked test environment with Hermes PM
        run: |
          test "$(git -C "$HERMES_SOURCE_PATH" rev-parse HEAD)" = "$HERMES_REVISION"
          bash scripts/build-test-env.sh

      # Preserve the PM-built host environment; do not sync the standalone plugin graph.
      - name: Check Python code
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run unit and protocol tests
        run: uv run --no-sync pytest --ignore=tests/test_host_contract.py

      - name: Validate native plugin against stable Hermes
        run: uv run --no-sync pytest tests/test_host_contract.py

      - name: Exercise the native foreground gateway lifecycle
        env:
          HERMES_GATEWAY_SMOKE: "1"
        run: uv run --no-sync pytest tests/test_gateway_smoke.py

      - name: Verify dependency and plugin metadata stayed unchanged
        run: git diff --exit-code -- pyproject.toml uv.lock plugin.yaml
